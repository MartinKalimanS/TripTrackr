# Smoke flow: the app launches and renders its first screen.
#
# This asserts the one thing every other flow depends on. If it fails, the
# remaining flows' results carry no information.
#
# `clearState` wipes the keychain, so the session store hydrates to
# `signed-out` and the auth gate (src/app/_layout.tsx, Stack.Protected) MUST
# land on the welcome screen. Seeing the tabs here would mean the gate let an
# unauthenticated launch through — the failure R009 exists to prevent.
appId: com.triptrackr.app
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'app-root'
- assertVisible:
    id: 'welcome-screen'
- assertNotVisible:
    id: 'tab-bar'

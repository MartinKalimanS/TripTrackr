# Rows 3, 4, 6, 13, 14 — the "before" snapshot on device B, taken while device A
# is still offline. Device B, ONLINE.
#
# Every "it arrived on B" claim later in the gate is only worth something if B
# demonstrably did NOT have it first. B relaunches (which pulls) and then looks
# for everything the offline window created or deleted on A. None of it can be
# here yet, and what A deleted is still here:
#   - 'Synced note to delete' is still present  (row 4: the deletion has not
#     propagated, so its later absence is caused by the sync, not by B never
#     having had it)
#   - no 'Offline note' / 'Ephemeral note'      (rows 1, 3, 4)
#   - no 12.34 and no 7.77 expense               (rows 1, 13)
#   - no photo and no document                   (rows 6; FR-041: the server has
#     no photo row until the bytes land, so B must not show a "normal-looking
#     photo that is silently absent")
#   - no 'Gate offline trip'                     (row 13)
#   - Stop 2 Paris still on the itinerary, two countries on the globe (row 14)
appId: com.triptrackr.app
---
- runFlow: _helpers/relaunch.yaml
- tapOn:
    id: 'tab-trips'
- assertVisible: 'Gate baseline'
- assertNotVisible: 'Gate offline trip'
- tapOn: 'Gate baseline'
- assertVisible: 'Stop 1: Rom(a|e).*'
- assertVisible: 'Stop 2: Paris.*'

- tapOn:
    id: 'trip-open-notes'
- assertVisible: 'Synced note to delete'
- assertVisible: 'Shared note'
- assertNotVisible: 'Offline note'
- assertNotVisible: 'Ephemeral note'
- tapOn: 'Back'

- tapOn:
    id: 'trip-open-expenses'
- assertVisible: '.*20.00.*'
- assertNotVisible: '.*12.34.*'
- assertNotVisible: '.*7.77.*'
- tapOn: 'Back'

- tapOn:
    id: 'trip-open-photos'
- assertVisible: 'No photos yet'
- tapOn: 'Back'

- tapOn:
    id: 'trip-open-documents'
- assertVisible: 'No documents yet'
- tapOn: 'Back'
- tapOn: 'Back'

# The globe still shows two countries (Italy, France).
- tapOn:
    id: 'tab-index'
- assertVisible:
    id: 'globe-stat-countries'
    text: '2'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 14-b-globe-before-sync

# TripTrackr development stack.
#
# Constitution, Technology & Platform Constraints: the whole stack MUST remain
# runnable on a single modest VPS. Everything here is self-hosted; nothing depends
# on a hyperscaler-managed service.

name: triptrackr

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triptrackr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triptrackr}
      POSTGRES_DB: ${POSTGRES_DB:-triptrackr}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-triptrackr}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for development. Cloudflare R2 replaces this in
  # production (docker-compose.prod.yml). Buckets are private in both.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-triptrackr}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-triptrackr-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the two private buckets on first run. Explicitly does NOT set a public
  # download policy — objects are reachable only through signed URLs.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-triptrackr} ${S3_SECRET_ACCESS_KEY:-triptrackr-dev-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET_PHOTOS:-triptrackr-photos} &&
      mc mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-triptrackr-documents} &&
      echo 'Buckets ready (private).'
      "

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    # En lugar de usar tsx (que fue borrado), ejecutamos el código ya compilado a JavaScript
    command: [ 'node', 'dist/db/migrate.js' ]
    restart: 'no'

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../.env
    ports:
      - '3000:3000'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${API_HOST:-api.localhost}`)'
      - 'traefik.http.services.api.loadbalancer.server.port=3000'
      # Coarse edge rate limiting. The per-account limiter lives in the API (T032).
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.average=100'
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.burst=50'
      - 'traefik.http.routers.api.middlewares=api-ratelimit@docker'

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    command: ['npm', 'run', 'worker']

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:

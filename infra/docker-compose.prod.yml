# Production overrides. Run as:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from development:
#   - Object storage is Cloudflare R2, so MinIO is not started.
#   - Traefik terminates TLS with an ACME resolver.
#   - Ports are not published for postgres, redis, or the API; only Traefik is public.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    profiles: ['donotstart']

  minio-init:
    profiles: ['donotstart']

  api:
    ports: !reset []
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${API_HOST}`)'
      - 'traefik.http.routers.api.entrypoints=websecure'
      - 'traefik.http.routers.api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.api.loadbalancer.server.port=3000'
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.average=100'
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.burst=50'
      - 'traefik.http.routers.api.middlewares=api-ratelimit@docker'

  traefik:
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

volumes:
  letsencrypt:

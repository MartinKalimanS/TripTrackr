<!--frame id=search-recent no=27 title="Global search, recent" cap="Empty query: recent searches (removable, one-tap clear) and quick scopes. Keyboard up, nothing is auto-run."-->
<div class="screen">
  <div class="sbar"><div class="input is-focus pillfield" role="search">[[i:search]]<span class="val"><span class="caret" style="margin-left:0;margin-right:var(--sp-1)"></span><span class="ph-t" data-long="Search trips, places, notes and countries">Search trips, places, notes</span></span></div><button class="btn btn-text">Cancel</button></div>
  <div class="scroll" style="padding-top:var(--sp-2)">
    <div class="rh"><h2 class="t-callout">Recent</h2><button class="link nou">Clear all</button></div>
    <ul style="--lead:20px">
      <li class="rec"><button class="rrow">[[i20:history]]<span class="tx"><span class="t-callout">Lisbon</span></span></button><button class="ibtn plain" aria-label="Remove Lisbon from recent">[[i16:x]]</button></li>
      <li class="rec"><button class="rrow">[[i20:history]]<span class="tx"><span class="t-callout">Japan 2026</span></span></button><button class="ibtn plain" aria-label="Remove Japan 2026 from recent">[[i16:x]]</button></li>
      <li class="rec"><button class="rrow">[[i20:history]]<span class="tx"><span class="t-callout">ramen</span></span></button><button class="ibtn plain" aria-label="Remove ramen from recent">[[i16:x]]</button></li>
    </ul>
    <div class="rh" style="margin-top:var(--sp-4)"><h2 class="t-callout">Jump to</h2></div>
    <div class="chips wrapc"><button class="chip">[[i20:luggage]]Past trips</button><button class="chip">[[i20:globe]]Countries</button><button class="chip">[[i20:notebook-pen]]Notes</button><button class="chip">[[i20:image]]Photos</button></div>
  </div>
</div>
{{INC:kb-letters-search}}

<!--frame id=trip-menu no=24 title="Trip menu" status=photo cap="'More' on the trip header. Edit, Share summary, Download map; Delete is separated, crimson with icon and verb, and asks for confirmation. On iOS this is a native action sheet / context menu; Android uses an M3 bottom sheet."-->
{{INC:trip-backdrop-titled}}
<div class="dim"></div>
<div class="sheet auto menu" role="dialog" aria-modal="true" aria-label="Trip menu">
  <div class="grab"></div>
  <div class="mhead"><i class="ph mth" data-ph="sintraY@center 40%"></i><div class="tx"><div class="t-callout clamp-1" data-long="Portugal Road Trip with the whole family and a very long name that keeps going">Portugal Road Trip</div><div class="t-label c2 tnum">12&ndash;19 Oct 2026 &middot; 3 stops</div></div><button class="ibtn" aria-label="Close menu">[[i:x]]</button></div>
  <ul class="mlist2">
    <li><button class="mi">[[i:pencil]]<span class="tx"><span class="t-callout">Edit trip</span><span class="t-label c2">Name, dates, cover, currency</span></span>[[i20:chevron-right.chev]]</button></li>
    <li><button class="mi">[[i:share-2]]<span class="tx"><span class="t-callout">Share summary</span><span class="t-label c2">A photo card. No expenses or documents.</span></span>[[i20:chevron-right.chev]]</button></li>
    <li><button class="mi">[[i:download]]<span class="tx"><span class="t-callout">Download map</span><span class="t-label c2 tnum">186 MB for offline use</span></span>[[i20:chevron-right.chev]]</button></li>
  </ul>
  <div class="msep"></div>
  <button class="mi del">[[i:trash-2]]<span class="tx"><span class="t-callout">Delete trip</span><span class="t-label">You can undo for 10 seconds</span></span></button>
</div>

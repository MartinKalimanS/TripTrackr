<!--frame id=recap-share no=22 title="Share your year" cap="Share preview of the 9:16 poster (exported at 1080x1920 from a Skia/SVG canvas). Poster is theme-independent. Share is the one primary; Save image is secondary."-->
<div class="screen">
  <header class="nav"><button class="ibtn" aria-label="Close">[[i:x]]</button><h1 class="tt t-callout">Share your year</h1><span style="width:var(--tap)"></span></header>
  <div class="scroll" style="display:flex;flex-direction:column;align-items:center;padding-top:var(--sp-3)">
    <div class="pwrap"><div class="pscale">{{INC:poster}}</div></div>
    <p class="t-label c2" style="text-align:center;margin-top:var(--sp-3)">Only your totals are shared. Never expenses or documents.</p>
  </div>
  <div class="dv-foot" style="flex-direction:row;gap:var(--sp-3);background:var(--paper)">
    <button class="btn btn-secondary" style="flex:1">[[i20:download]]Save</button>
    <button class="btn btn-primary" style="flex:2">[[i20:share-2]]Share</button>
  </div>
</div>

<!--frame id=photos no=04 title="Photos (trip)" cap="Grouped by day with a big date numeral, 3-column mosaic with a 2x2 lead and a +N tile. Upload state lives on the thumbnail: dashed = queued, ring = uploading, check = just synced, alert = failed."-->
<div class="screen">
<header class="nav"><button class="ibtn" aria-label="Back to trip">[[i:chevron-left]]</button><div class="grp"><button class="ibtn" aria-label="Select photos">[[i:check-check]]</button><button class="ibtn" aria-label="More">[[i:ellipsis]]</button></div></header>
<div class="lt"><h1 class="t-title">Photos</h1><p class="t-label sub clamp-1" data-long="Portugal Road Trip with the whole family, including the two weeks in the Alentejo">Portugal Road Trip &middot; <span class="tnum">128</span> photos</p></div>
<div class="syncrow" role="status">
  <span class="pring" style="--p:62;--sz:20px;--w:3px;--c:var(--coral-line);--t:var(--sand)"></span>
  <span class="t-caption">Uploading 2 of 5</span><span class="dot"></span><span class="t-caption" style="color:var(--danger)">1 failed</span>
  <span class="grow"></span><button class="link nou" aria-label="Retry failed upload">Retry</button>
</div>
<div class="scroll scroll-y pad-b">
  <section class="day" aria-label="Wednesday 14 October, Sintra">
    <div class="dh"><div class="dn t-display prop">14</div><div class="dt"><div class="t-callout clamp-1">Sintra</div><div class="t-label c2">Wed &middot; Oct &middot; <span class="tnum">14</span> photos</div></div></div>
    <div class="mos">
      <button class="pt big" aria-label="Photo 1, uploading 62 percent"><i class="ph" data-ph="sintra@center"></i><span class="ub up"><span class="pring" style="--p:62;--sz:24px;--w:3px;--c:var(--on-photo);--t:rgba(255,255,255,.3)"></span></span></button>
      <button class="pt" aria-label="Photo 2, queued, waiting for Wi-Fi"><i class="ph" data-ph="pena@center 30%"></i><span class="ub q">[[i16:cloud-upload]]</span></button>
      <button class="pt" aria-label="Photo 3, synced"><i class="ph" data-ph="sintraY@center 30%"></i><span class="ub ok">[[i16:check]]</span></button>
      <button class="pt fail" aria-label="Photo 4, upload failed. Tap to retry"><i class="ph" data-ph="pena@center 70%"></i><span class="fl">[[i16:triangle-alert]]Retry</span></button>
      <button class="pt" aria-label="Photo 5"><i class="ph" data-ph="sintra@20% 60%"></i></button>
      <button class="pt more" aria-label="9 more photos from 14 October"><i class="ph" data-ph="sintraY@center 80%"></i><span class="mo t-callout tnum">+9</span></button>
    </div>
  </section>
  <section class="day" aria-label="Tuesday 13 October, Lisbon">
    <div class="dh"><div class="dn t-display prop">13</div><div class="dt"><div class="t-callout clamp-1">Lisbon</div><div class="t-label c2">Tue &middot; Oct &middot; <span class="tnum">21</span> photos</div></div></div>
    <div class="mos">
      <button class="pt" aria-label="Photo 1"><i class="ph" data-ph="arco@center"></i></button>
      <button class="pt big r" aria-label="Photo 2"><i class="ph" data-ph="lisbonRoofs@center 40%"></i></button>
      <button class="pt" aria-label="Photo 3"><i class="ph" data-ph="street@center"></i></button>
      <button class="pt" aria-label="Photo 4"><i class="ph" data-ph="tram@center"></i></button>
      <button class="pt" aria-label="Photo 5"><i class="ph" data-ph="cafe@center"></i></button>
    </div>
  </section>
</div>
<div class="fade-b" style="bottom:0;height:120px"></div>
<button class="btn btn-primary fab" aria-label="Add photos">[[i:image-plus]]Add photos</button>
</div>

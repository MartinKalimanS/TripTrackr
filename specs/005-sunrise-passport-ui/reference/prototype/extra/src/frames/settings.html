<!--frame id=settings no=18 title="Settings" cap="Grouped list. Appearance uses text labels (Light, Dark, Auto) and says contrast follows the phone. Sync shows one status line. Delete account is visibly disabled: 'Coming soon'."-->
<div class="screen">
  <header class="nav"><button class="ibtn" aria-label="Back">[[i:chevron-left]]</button><h1 class="tt t-callout">Settings</h1><span style="width:var(--tap)"></span></header>
  <div class="scroll scroll-y" style="padding-top:var(--sp-3);padding-bottom:var(--sp-6)">
    <div class="group g1">
      <button class="lrow noic acc"><i class="ph ava" data-ph="marta@center 25%"></i><span class="tx"><span class="t-callout t1 clamp-1" data-long="Marta Fernanda Souza de Albuquerque Cavalcanti">Marta Souza</span><span class="t-label t2 clamp-1">marta@example.com</span></span>[[i20:chevron-right.chev]]</button>
    </div>

    <div class="group g2">
      <div class="lrow noic"><span class="ico">[[i20:palette]]</span><span class="tx"><span class="t-callout t1">Appearance</span></span></div>
      <div class="segwrap"><div class="seg" role="radiogroup" aria-label="Appearance" data-theme-seg><button role="radio" class="is-on" aria-checked="true">[[i20:sun]]Light</button><button role="radio" aria-checked="false">[[i20:moon]]Dark</button><button role="radio" aria-checked="false">[[i20:smartphone]]Auto</button></div></div>
      <p class="t-label c2 note-i">[[i16:info]]<span>Higher contrast follows your phone's Accessibility settings.</span></p>
    </div>

    <div class="group g3">
      <button class="lrow"><span class="ico">[[i20:cloud-check]]</span><span class="tx"><span class="t-callout t1">Sync</span><span class="t-label t2"><span style="color:var(--success-ink);font-weight:600">Up to date</span>, 2 min ago</span></span>[[i20:chevron-right.chev]]</button>
      <button class="lrow"><span class="ico">[[i20:shield-check]]</span><span class="tx"><span class="t-callout t1">Privacy</span><span class="t-label t2" data-long="Expenses and documents are never shared with anyone, not even people on your trips">Expenses and documents are never shared</span></span>[[i20:chevron-right.chev]]</button>
      <button class="lrow"><span class="ico">[[i20:hard-drive]]</span><span class="tx"><span class="t-callout t1">Storage</span><span class="t-label t2 tnum">412 MB of maps &middot; 1.1 GB photos</span></span>[[i20:chevron-right.chev]]</button>
    </div>

    <div class="group g4">
      <button class="lrow"><span class="ico">[[i20:info]]</span><span class="tx"><span class="t-callout t1">About TripTrackr</span><span class="t-label t2 tnum">Version 2.0 (118)</span></span>[[i20:chevron-right.chev]]</button>
    </div>

    <div class="group g5">
      <button class="lrow"><span class="ico">[[i20:log-out]]</span><span class="tx"><span class="t-callout t1">Sign out</span></span></button>
      <div class="lrow dis" aria-disabled="true" role="button"><span class="ico">[[i20:trash-2]]</span><span class="tx"><span class="t-callout t1">Delete account</span></span><span class="pill p-neutral">Coming soon</span></div>
    </div>
  </div>
</div>

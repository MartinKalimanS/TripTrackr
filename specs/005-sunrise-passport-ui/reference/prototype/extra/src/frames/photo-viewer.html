<!--frame id=photo-viewer no=05 title="Photo viewer" status=photo hind=photo cap="Full-screen viewer on the photo's own ambient blur (expo-image blurRadius, no backdrop-filter). Caption sheet carries place, time, upload state, caption, share and delete."-->
<div class="screen viewer" style="padding-top:0;background:var(--on-coral)">
  <div class="ambient ph" data-ph="sintra@center"></div>
  <div class="amb-scrim"></div>
  <div class="vtop">
    <button class="ibtn on-photo" aria-label="Close">[[i:x]]</button>
    <span class="pill on-photo tnum">7 of 128</span>
    <div class="grp"><button class="ibtn on-photo" aria-label="Share">[[i:share-2]]</button><button class="ibtn on-photo" aria-label="More">[[i:ellipsis]]</button></div>
  </div>
  <figure class="vphoto ph" data-ph="sintra@center 40%" role="img" aria-label="Pena Palace in Sintra, red clock tower against a blue sky"></figure>
  <div class="sheet auto vsheet" style="top:auto">
    <div class="grab"></div>
    <div class="vmeta">
      <div class="vplace">[[flag:pt]]<div><div class="t-callout clamp-1">Sintra, Portugal</div><div class="t-label c2">Wed 14 Oct &middot; 16:42</div></div></div>
      <span class="pill p-neutral"><span class="pring" style="--p:62;--sz:16px;--w:2.5px;--c:var(--coral-line);--t:var(--sand)"></span><span class="tnum">Uploading 62%</span></span>
    </div>
    <div class="vcap input">[[i:pen-line]]<span class="val" data-long="Pena Palace, the clock tower and the long walk up through the gardens before the crowds arrived">Pena Palace, the clock tower at ten</span></div>
    <div class="vact">
      <button class="abtn">[[i:share-2]]<span>Share</span></button>
      <button class="abtn">[[i:download]]<span>Save copy</span></button>
      <button class="abtn danger">[[i:trash-2]]<span>Delete</span></button>
    </div>
  </div>
</div>

<!--frame id=countries no=03 title="Countries (Home, full detent)" cap="The accessible twin of the globe: grouped by continent, flag chip, trips and first year, ring 14 of 195, search, sticky headers. Sheet top at 92 %."-->
<div class="backdrop sky-bg" aria-hidden="true"><div class="orb"></div></div>
<div class="sheet" style="--top:68px" role="region" aria-label="Countries">
  <div class="grab"></div>
  <div class="ch-head">
    <div class="ch-title"><h1 class="t-title">Countries</h1></div>
    <button class="ibtn" aria-label="Collapse to globe">[[i:chevron-down]]</button>
  </div>
  <div class="ch-search"><div class="input pillfield">[[i:search]]<span class="val ph-t">Search countries</span></div></div>
  <div class="ch-scroll scroll-y">
    <section class="sumcard" aria-label="14 of 195 countries visited">
      <svg class="sring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="31" class="tr"/><circle cx="36" cy="36" r="31" class="pg" stroke-dasharray="14 195" transform="rotate(-90 36 36)" style="stroke-dasharray:calc(var(--p) * 1.948) 195.0;--p:7.2"/></svg>
      <div class="sc-num t-headline prop">14</div>
      <div class="sc-tx"><div class="t-headline prop" data-long="14 of 195 countries and territories visited">14 of 195</div><div class="t-label c2">4 of 7 continents &middot; 19 trips</div></div>
      <div class="sc-stamps" aria-hidden="true"><div data-stamp="pt" data-norot style="width:44px;height:44px;--r:-9deg"></div><div data-stamp="jp" data-norot style="width:40px;height:40px;--r:7deg;margin-left:-8px;margin-top:20px"></div></div>
    </section>

    <div class="chead"><h2 class="t-callout">Europe</h2><span class="t-label c2 tnum">9 countries</span></div>
    <ul class="clist">
      <li><button class="crow">[[flag:pt]]<div class="tx"><div class="nm"><span class="t-callout">Portugal</span><span class="pill p-now">[[i16:circle-dot]]Now</span></div><div class="t-label c2">First visited 2021</div></div><div class="cnt"><b class="tnum">3</b> trips</div>[[i16:chevron-right.chev]]</button></li>
      <li><button class="crow">[[flag:es]]<div class="tx"><div class="nm"><span class="t-callout">Spain</span></div><div class="t-label c2">First visited 2019</div></div><div class="cnt"><b class="tnum">3</b> trips</div>[[i16:chevron-right.chev]]</button></li>
      <li><button class="crow">[[flag:fr]]<div class="tx"><div class="nm"><span class="t-callout">France</span></div><div class="t-label c2">First visited 2022</div></div><div class="cnt"><b class="tnum">2</b> trips</div>[[i16:chevron-right.chev]]</button></li>
      <li><button class="crow">[[flag:it]]<div class="tx"><div class="nm"><span class="t-callout">Italy</span></div><div class="t-label c2">First visited 2023</div></div><div class="cnt"><b class="tnum">1</b> trip</div>[[i16:chevron-right.chev]]</button></li>
      <li><button class="crow">[[flag:gb]]<div class="tx"><div class="nm"><span class="t-callout" data-long="United Kingdom of Great Britain and Northern Ireland">United Kingdom</span></div><div class="t-label c2">First visited 2023</div></div><div class="cnt"><b class="tnum">1</b> trip</div>[[i16:chevron-right.chev]]</button></li>
      <li><button class="crow">[[flag:de]]<div class="tx"><div class="nm"><span class="t-callout">Germany</span></div><div class="t-label c2">First visited 2022</div></div><div class="cnt"><b class="tnum">1</b> trip</div>[[i16:chevron-right.chev]]</button></li>
      <li><button class="crow">[[flag:nl]]<div class="tx"><div class="nm"><span class="t-callout">Netherlands</span></div><div class="t-label c2">First visited 2022</div></div><div class="cnt"><b class="tnum">1</b> trip</div>[[i16:chevron-right.chev]]</button></li>
    </ul>
  </div>
  <div class="fade-b" style="bottom:0"></div>
</div>
{{TABS:globe}}

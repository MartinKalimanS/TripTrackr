# Security gate (step S-01; docs/roadmap/CICD-AND-RELEASE.md section 2.1).
#
# Four independent scans and one gate job. Branch protection requires the job named
# "Security passed", which fails if ANY scan failed, was cancelled or was skipped, so a deleted or
# path-filtered scan cannot turn the gate green (the same rule as "CI passed" in ci.yml).
#
#   codeql     static analysis of the TypeScript
#   gitleaks   secrets in the diff and in the history
#   audit      `npm audit` of the production dependencies, through scripts/audit-gate.mjs, which
#              honours security/audit-allowlist.json (every waiver has a reason and an expiry)
#   image-scan Trivy on the API and backup images (CRITICAL and HIGH with a fix available)
#
# Third-party actions are pinned by commit SHA (the tag is in the comment). Dependabot keeps the
# pins current (`github-actions` ecosystem in .github/dependabot.yml).

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC: new advisories appear without a push

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

defaults:
  run:
    shell: bash

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The allowlist of fixtures is .gitleaks.toml: an entry needs a documented reason.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Reads the lockfile only: no install script runs in this job.
      - run: npm ci --ignore-scripts
      - run: npm run test:scripts
      - run: node scripts/audit-gate.mjs

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: apps/api/Dockerfile, context: . }
          - { name: backup, dockerfile: infra/backup/Dockerfile, context: infra }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the ${{ matrix.image.name }} image
        run: docker build -f ${{ matrix.image.dockerfile }} -t triptrackr-${{ matrix.image.name }}:scan ${{ matrix.image.context }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: triptrackr-${{ matrix.image.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # Waivers: security/trivy-ignore.yaml (each with a statement and an expiry date).
          trivyignores: security/trivy-ignore.yaml

  security-passed:
    name: Security passed
    needs: [codeql, gitleaks, audit, image-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every scan succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "scan results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a security scan did not succeed ($result)"
              exit 1
            fi
          done

# Release PR and tags (docs/roadmap/CICD-AND-RELEASE.md section 2.4, step S-30).
#
# Every push to main opens or updates one release PR (CHANGELOG.md and the version
# fields named in release-please-config.json). Merging it creates the `vX.Y.Z` tag and
# the GitHub Release, which start the deploy and mobile release workflows.
#
# A tag created with the default GITHUB_TOKEN does NOT trigger other workflows. For the
# tag to start `mobile-release.yml`, the owner adds a fine-grained token (contents and
# pull requests: write) as the repository secret RELEASE_PLEASE_TOKEN
# (docs/release/owner-checklist.md). Without it this workflow still opens the release PR,
# and the owner dispatches `mobile-release.yml` by hand.
#
# `googleapis/release-please-action` is third-party: pin it to a full commit SHA.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

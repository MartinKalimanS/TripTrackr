# A PR title is a conventional commit (docs/roadmap/CICD-AND-RELEASE.md section 1; step S-01).
#
# PRs are squash-merged, so the title becomes the commit on `main` that release-please reads
# (step S-30). The job needs no checkout and no secret: it only reads the title the event carries.
# It uses `pull_request_target` so a fork's PR can be checked too, which is safe here BECAUSE
# nothing from the PR is checked out or executed.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            build
            ci
            chore
            perf
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the PR title must not start with an upper-case letter
            (conventional commits: "feat(mobile): add the tour", not "feat: Add the tour").
